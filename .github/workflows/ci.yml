name: Сборка и тесты

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            preset: ci-windows
          - name: Windows x64, окно
            os: windows-latest
            preset: ci-windows-gui
          - name: Linux
            os: ubuntu-latest
            preset: ci-linux

    steps:
      - uses: actions/checkout@v7

      - name: Окружение MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Ninja, Qt и виртуальный экран
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build qt6-base-dev qt6-webengine-dev libgl-dev libgl1-mesa-dri xvfb fonts-dejavu-core

      - name: Qt для окна
        if: matrix.preset == 'ci-windows-gui'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          # веб-интерфейс принтера во вкладке «Принтер» (Qt WebEngine, LGPL-3.0)
          modules: 'qtwebengine qtwebchannel qtpositioning'
          cache: true

      # Кэш библиотек vcpkg: берётся последний сохранённый для этого пресета; новый сохраняется
      # сразу после настройки, если vcpkg что-то собрал (новая библиотека, обновился компилятор), —
      # даже если дальше что-то упадёт: OpenCascade собирается три четверти часа.
      - name: Кэш библиотек vcpkg
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/.vcpkg-cache
          key: vcpkg-${{ matrix.preset }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: vcpkg-${{ matrix.preset }}-

      - name: Настройка vcpkg
        shell: bash
        run: |
          mkdir -p "${{ github.workspace }}/.vcpkg-cache"
          echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
          echo "VCPKG_BINARY_SOURCES=clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite" >> "$GITHUB_ENV"
          echo "VCPKG_CACHE_FILES=$(find "${{ github.workspace }}/.vcpkg-cache" -type f | wc -l)" >> "$GITHUB_ENV"

      - name: Конфигурация
        run: cmake --preset ${{ matrix.preset }}

      - name: Собрал ли vcpkg новые библиотеки
        id: vcpkg-new
        if: always()
        shell: bash
        run: |
          now=$(find "${{ github.workspace }}/.vcpkg-cache" -type f | wc -l)
          echo "в кэше было $VCPKG_CACHE_FILES файлов, стало $now"
          if [ "$now" != "$VCPKG_CACHE_FILES" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - name: Сохранить кэш библиотек vcpkg
        if: always() && steps.vcpkg-new.outputs.changed == 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/.vcpkg-cache
          key: vcpkg-${{ matrix.preset }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Сборка
        shell: bash
        run: |
          set -o pipefail
          if ! cmake --build --preset ${{ matrix.preset }} 2>&1 | tee build.log; then
            # логи CI не скачиваются — первые ошибки компилятора выносим в аннотации
            grep -E "error|warning C" build.log | grep -v "^ninja: build stopped" | head -25 |
              while IFS= read -r l; do echo "::error title=Сборка::${l:0:900}"; done
            exit 1
          fi

      - name: Тесты
        shell: bash
        run: |
          set -o pipefail
          if ! ctest --preset ${{ matrix.preset }} --output-on-failure 2>&1 | tee tests.log; then
            # логи CI не скачиваются — проваленные проверки выносим в аннотации
            grep -E "FAILED|failed|error" tests.log | head -25 |
              while IFS= read -r l; do echo "::error title=Тесты::${l:0:900}"; done
            exit 1
          fi

      - name: kika.exe запускается на чистой Windows
        if: matrix.preset == 'ci-windows'
        shell: pwsh
        timeout-minutes: 5
        run: |
          $exe = "build/${{ matrix.preset }}/bin/kika.exe"
          $deps = (dumpbin /nologo /dependents $exe | Out-String)
          Write-Output $deps
          if ($deps -match '(?i)msvcp|vcruntime|ucrtbase|api-ms-win-crt') {
            throw 'kika.exe требует среду выполнения Visual C++ — на чистой Windows не запустится'
          }
          & $exe --version;  if ($LASTEXITCODE -ne 0) { throw 'kika --version' }
          & $exe;            if ($LASTEXITCODE -ne 0) { throw 'kika без аргументов' }
          & $exe prototype/examples/bracket_side.gcode
          if ($LASTEXITCODE -ne 0) { throw 'kika <файл>' }
          & $exe run prototype/examples/bracket_side.job.json --max-elems 20000 --json итоги.json -o пример-отчёта/кронштейн_отчёт.html
          if ($LASTEXITCODE -ne 0) { throw 'kika run <задание>' }
          $s = Get-Content итоги.json -Raw -Encoding utf8 | ConvertFrom-Json
          if ($s.Count -ne 3 -or $s[0].verdict -ne 'ok') { throw 'kika run: неожиданные итоги' }
          $r = Get-Content пример-отчёта/кронштейн_отчёт.html -Raw -Encoding utf8
          if ($r -notmatch 'window\.FDM_PAYLOAD = "H4sI') { throw 'kika run: в отчёте нет данных для 3D-вида' }

      - name: Python для сверки с прототипом
        if: runner.os == 'Linux'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Сверка с прототипом на Python
        if: runner.os == 'Linux'
        run: |
          python -m pip install --quiet numpy scipy
          python tools/compare_with_prototype.py --kika build/${{ matrix.preset }}/bin/kika

      - name: Подбор печати из командной строки
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: |
          bin=build/${{ matrix.preset }}/bin
          # экономно и прочно: задание с лучшим вариантом считается с тем же запасом, что обещан
          $bin/kika advise examples/bracket_L.job.json --goals economy,strength --refine-elems 60000 \
            --json подбор.json --save-job подбор.job.json
          $bin/kika run подбор.job.json --no-report --quiet --json подбор_итоги.json
          python3 - <<'PY'
          import json
          best = json.load(open('подбор.json', encoding='utf-8'))['candidates'][0]
          cases = json.load(open('подбор_итоги.json', encoding='utf-8'))
          sf = min(c['sf'] for c in cases)
          print('обещан запас', best['sf'], '— посчитан', sf)
          assert best['sf_refined'] and best['feasible'], best
          assert abs(sf - best['sf']) < 1e-4 * best['sf'], (sf, best['sf'])
          assert all(c['verdict'] == 'ok' for c in cases), cases
          PY

      - name: Отправка на принтер (имитация Moonraker)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        env:
          # встроенный браузер (Qt WebEngine) на машине CI: без песочницы Chromium и видеокарты
          QTWEBENGINE_DISABLE_SANDBOX: 1
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
        run: |
          bin=build/${{ matrix.preset }}/bin
          python3 tools/mock_moonraker.py --port 7130 --dir mock_gcodes --speed 60 > mock.log 2>&1 &
          sleep 1
          $bin/kika printer 127.0.0.1:7130
          $bin/kika slice examples/bracket_L.3mf -q --send 127.0.0.1:7130 --start --name "Уголок"
          grep -q "принят Ugolok.gcode" mock.log
          grep -q "печать: True" mock.log
          grep -q "PRINT_START BED=" mock_gcodes/Ugolok.gcode
          $bin/kika printer 127.0.0.1:7130 --pause | grep -q "пауза"
          $bin/kika printer 127.0.0.1:7130 --cancel | grep -q "отменена"
          # окно: подключиться, нарезать и отправить с запуском; страница принтера — во встроенном браузере
          ldd $bin/kika-gui | grep -q libQt6WebEngineWidgets
          xvfb-run -a -s "-screen 0 1600x1000x24" $bin/kika-gui examples/bracket_L.job.json --printer 127.0.0.1:7130 \
            --send-print --printer-shot kika-gui-linux-printer.png --settings-shot kika-gui-linux-settings.png --size 1560x940
          grep -q "принят bracket_L.gcode" mock.log
          grep -q '"GET / HTTP' mock.log
          kill %1 || true

      - name: Окно на Linux (виртуальный экран)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          xvfb-run -a -s "-screen 0 1600x1000x24" build/${{ matrix.preset }}/bin/kika-gui \
            --example --run --field sf --screenshot kika-gui-linux.png --size 1400x900
          # модель 3MF: своя нарезка и расчёт; поворот на бок с древовидными поддержками
          xvfb-run -a -s "-screen 0 1600x1000x24" build/${{ matrix.preset }}/bin/kika-gui \
            examples/bracket_L.job.json --run --field sf --screenshot kika-gui-linux-model.png --size 1400x900
          xvfb-run -a -s "-screen 0 1600x1000x24" build/${{ matrix.preset }}/bin/kika-gui \
            examples/bracket_L.3mf --rotate y --support tree --field structure --save-gcode bracket_L_kika.gcode \
            --screenshot kika-gui-linux-rotate.png --size 1400x900
          grep -q "generated by Kika" bracket_L_kika.gcode
          grep -q ";TYPE:Support" bracket_L_kika.gcode
          # подбор положения и настроек (быстро и экономно), применение и расчёт
          xvfb-run -a -s "-screen 0 1600x1000x24" build/${{ matrix.preset }}/bin/kika-gui \
            examples/bracket_L.job.json --advise speed,economy --apply --run --field sf \
            --screenshot kika-gui-linux-advise.png --size 1400x900
          # вкладки «Подготовка» (положить на грань, масштаб, место на столе) и «Предпросмотр» (глажка, скорость)
          xvfb-run -a -s "-screen 0 1600x1000x24" build/${{ matrix.preset }}/bin/kika-gui \
            examples/bracket_L.3mf --lay 0.26,0.6 --scale 1.2 --move 100,120 --tab prepare --view part \
            --save-gcode bracket_L_lay.gcode --screenshot kika-gui-linux-prepare.png --size 1560x940
          grep -q "generated by Kika" bracket_L_lay.gcode
          xvfb-run -a -s "-screen 0 1600x1000x24" build/${{ matrix.preset }}/bin/kika-gui \
            examples/bracket_L.3mf --set ironing=topmost --set top_pattern=concentric --tab preview --view part \
            --save-gcode bracket_L_iron.gcode --screenshot kika-gui-linux-preview.png --size 1560x940
          grep -q ";TYPE:Ironing" bracket_L_iron.gcode
          xvfb-run -a -s "-screen 0 1600x1000x24" build/${{ matrix.preset }}/bin/kika-gui \
            examples/bracket_L.3mf --tab preview --color speed --layers 1:120 --view part \
            --screenshot kika-gui-linux-preview-speed.png --size 1560x940

      - name: Сборка окна в папку
        if: matrix.preset == 'ci-windows-gui'
        shell: pwsh
        run: |
          # логи CI не всегда доступны — причину ошибки пишем в аннотацию к сборке
          trap { Write-Output "::error title=Сборка окна в папку::$($_.InvocationInfo.ScriptLineNumber): $_"; break }
          $out = 'kika-windows-x64'
          New-Item -ItemType Directory -Force $out, "$out/examples", "$out/licenses" | Out-Null
          Copy-Item build/${{ matrix.preset }}/bin/kika-gui.exe, build/${{ matrix.preset }}/bin/kika.exe $out
          # OpenCascade (STEP): TK*.dll, которые vcpkg положил рядом с программой при сборке
          Get-ChildItem build/${{ matrix.preset }}/bin -Filter *.dll | Copy-Item -Destination $out
          if (-not (Test-Path "$out/TKernel.dll")) { throw 'нет библиотек OpenCascade (TKernel.dll) рядом с программой' }
          # библиотеки Qt, модули платформы и программный OpenGL (opengl32sw.dll); русские подписи диалогов
          windeployqt --release --no-compiler-runtime --no-system-d3d-compiler --translations ru "$out/kika-gui.exe"
          if ($LASTEXITCODE -ne 0) { throw "windeployqt: код выхода $LASTEXITCODE" }
          # среда выполнения Visual C++ рядом с программой — устанавливать её не нужно
          $crt = Get-ChildItem "$env:VCToolsRedistDir/x64" -Directory -Filter 'Microsoft.VC*.CRT' | Select-Object -First 1
          if (-not $crt) { throw "нет среды выполнения Visual C++ в $env:VCToolsRedistDir" }
          Copy-Item "$($crt.FullName)/*.dll" $out
          Get-ChildItem prototype/examples -File | Where-Object { $_.Name -match '\.(gcode|job\.json)$' } | Copy-Item -Destination "$out/examples"
          Get-ChildItem examples -File | Copy-Item -Destination "$out/examples"
          Get-ChildItem packaging/windows -File | Copy-Item -Destination $out
          # лицензии: LGPL-3.0 и GPL-3.0 (Qt), реестр сторонних библиотек, OpenCascade
          Get-ChildItem packaging/licenses -File | Copy-Item -Destination "$out/licenses"
          Copy-Item THIRD_PARTY.md "$out/licenses"
          $occt = "build/${{ matrix.preset }}/vcpkg_installed/x64-windows-static-md/share/opencascade/copyright"
          Copy-Item $occt "$out/licenses/OpenCASCADE-LGPL-2.1-exception.txt"
          Get-ChildItem -Recurse $out | Select-Object -ExpandProperty FullName

      - name: Окно запускается на Windows
        if: matrix.preset == 'ci-windows-gui'
        shell: pwsh
        timeout-minutes: 10
        run: |
          trap { Write-Output "::error title=Окно запускается на Windows::$($_.InvocationInfo.ScriptLineNumber): $_"; break }
          $out = 'kika-windows-x64'
          $deps = (dumpbin /nologo /dependents "$out/kika-gui.exe" | Out-String)
          Write-Output $deps
          foreach ($m in [regex]::Matches($deps, '(?im)^\s+((qt6|msvcp|vcruntime|tk)\S+\.dll)\s*$')) {
            if (-not (Test-Path "$out/$($m.Groups[1].Value)")) { throw "нет $($m.Groups[1].Value) рядом с kika-gui.exe" }
          }
          # на машине сборки нет видеокарты — OpenGL программный, как у пользователя без драйвера
          $env:QT_OPENGL = 'software'
          $p = Start-Process -FilePath "$out/kika-gui.exe" -Wait -PassThru `
            -ArgumentList '--example', '--run', '--field', 'sf', '--screenshot', "$PWD/kika-gui-windows.png", '--size', '1400x900'
          if ($p.ExitCode -ne 0) { throw "kika-gui: код выхода $($p.ExitCode)" }
          if (-not (Test-Path kika-gui-windows.png)) { throw 'kika-gui: нет снимка окна' }
          # модель 3MF из папки примеров: своя нарезка и расчёт
          $p = Start-Process -FilePath "$out/kika-gui.exe" -Wait -PassThru `
            -ArgumentList "$PWD/$out/examples/bracket_L.job.json", '--run', '--field', 'sf', '--screenshot', "$PWD/kika-gui-windows-model.png", '--size', '1400x900'
          if ($p.ExitCode -ne 0) { throw "kika-gui (модель): код выхода $($p.ExitCode)" }
          # STEP через OpenCascade — в окне и в kika.exe из той же папки
          $p = Start-Process -FilePath "$out/kika-gui.exe" -Wait -PassThru `
            -ArgumentList "$PWD/$out/examples/bracket_L.step", '--field', 'structure', '--save-gcode', "$PWD/bracket_L_step.gcode", '--screenshot', "$PWD/kika-gui-windows-step.png", '--size', '1400x900'
          if ($p.ExitCode -ne 0) { throw "kika-gui (STEP): код выхода $($p.ExitCode)" }
          if (-not (Select-String -Path bracket_L_step.gcode -Pattern 'generated by Kika' -Quiet)) { throw 'kika-gui: нет G-code по STEP' }
          # вкладки «Подготовка» и «Предпросмотр»
          $p = Start-Process -FilePath "$out/kika-gui.exe" -Wait -PassThru `
            -ArgumentList "$PWD/$out/examples/bracket_L.3mf", '--lay', '0.26,0.6', '--tab', 'prepare', '--view', 'part', '--screenshot', "$PWD/kika-gui-windows-prepare.png", '--size', '1560x940'
          if ($p.ExitCode -ne 0) { throw "kika-gui (подготовка): код выхода $($p.ExitCode)" }
          $p = Start-Process -FilePath "$out/kika-gui.exe" -Wait -PassThru `
            -ArgumentList "$PWD/$out/examples/bracket_L.3mf", '--tab', 'preview', '--view', 'part', '--screenshot', "$PWD/kika-gui-windows-preview.png", '--size', '1560x940'
          if ($p.ExitCode -ne 0) { throw "kika-gui (предпросмотр): код выхода $($p.ExitCode)" }
          if (-not (Test-Path "$out/QtWebEngineProcess.exe")) { throw 'нет QtWebEngineProcess.exe рядом с kika-gui.exe' }
          & "$out/kika.exe" info "$out/examples/bracket_L.step"; if ($LASTEXITCODE -ne 0) { throw 'kika info <STEP>' }
          & "$out/kika.exe" --version; if ($LASTEXITCODE -ne 0) { throw 'kika --version' }

      - name: Программа с окном для Windows
        if: matrix.preset == 'ci-windows-gui'
        uses: actions/upload-artifact@v7
        with:
          name: kika-gui-windows-x64
          path: kika-windows-x64/
          retention-days: 30

      - name: Снимки окна
        if: always() && (matrix.preset == 'ci-windows-gui' || runner.os == 'Linux')
        uses: actions/upload-artifact@v7
        with:
          name: kika-gui-screenshot-${{ runner.os }}
          path: kika-gui-*.png
          if-no-files-found: ignore
          retention-days: 30

      - name: Программа для Windows
        if: matrix.preset == 'ci-windows'
        uses: actions/upload-artifact@v7
        with:
          name: kika-windows-x64
          path: build/${{ matrix.preset }}/bin/*.exe
          retention-days: 30

      - name: Пример отчёта
        if: matrix.preset == 'ci-windows'
        uses: actions/upload-artifact@v7
        with:
          name: kika-report-example
          path: пример-отчёта/*.html
          retention-days: 30

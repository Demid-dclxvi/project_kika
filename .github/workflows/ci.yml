name: Сборка и тесты

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            preset: ci-windows
          - name: Linux
            os: ubuntu-latest
            preset: ci-linux

    steps:
      - uses: actions/checkout@v7

      - name: Окружение MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Ninja
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build

      - name: Кэш библиотек vcpkg
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.vcpkg-cache
          key: vcpkg-${{ matrix.preset }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: vcpkg-${{ matrix.preset }}-

      - name: Настройка vcpkg
        shell: bash
        run: |
          mkdir -p "${{ github.workspace }}/.vcpkg-cache"
          echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
          echo "VCPKG_BINARY_SOURCES=clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite" >> "$GITHUB_ENV"

      - name: Конфигурация
        run: cmake --preset ${{ matrix.preset }}

      - name: Сборка
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Тесты
        run: ctest --preset ${{ matrix.preset }}

      - name: kika.exe запускается на чистой Windows
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 2
        run: |
          $exe = "build/${{ matrix.preset }}/bin/kika.exe"
          $deps = (dumpbin /nologo /dependents $exe | Out-String)
          Write-Output $deps
          if ($deps -match '(?i)msvcp|vcruntime|ucrtbase|api-ms-win-crt') {
            throw 'kika.exe требует среду выполнения Visual C++ — на чистой Windows не запустится'
          }
          & $exe --version;  if ($LASTEXITCODE -ne 0) { throw 'kika --version' }
          & $exe;            if ($LASTEXITCODE -ne 0) { throw 'kika без аргументов' }
          & $exe prototype/examples/bracket_side.gcode
          if ($LASTEXITCODE -ne 0) { throw 'kika <файл>' }

      - name: Python для сверки с прототипом
        if: runner.os == 'Linux'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Сверка с прототипом на Python
        if: runner.os == 'Linux'
        run: |
          python -m pip install --quiet numpy
          python tools/compare_with_prototype.py --kika build/${{ matrix.preset }}/bin/kika

      - name: Программа для Windows
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: kika-windows-x64
          path: build/${{ matrix.preset }}/bin/*.exe
          retention-days: 30

<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Отчёт = ленточный лист: шапка с параметрами печати, карточки случаев, 3D-сцена во всю ширину, справка. */
:root {
  --bg: #f4f4f1; --surface: #ffffff; --fg: #16181b; --muted: #61646b; --line: #e1e2dc;
  --chip: #ecece7; --ink-btn: #16181b; --ink-btn-fg: #ffffff;
  --ok: #0a7d0a; --ok-bg: #e3f3e1; --risk: #a35a00; --risk-bg: #fdeccd; --fail: #b42323; --fail-bg: #fbe1df;
  --glass: rgba(255,255,255,.86); --tip-bg: #16181b; --tip-fg: #f4f4f1;
  --vw-bg: #eceee9; --vw-grid: #c5c8bf; --vw-grid-2: #dcded6; --vw-neutral: #c9c8c1; --vw-part: #d7dacd; --vw-dark: 0;
  --font-ui: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-num: "JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121315; --surface: #1b1d20; --fg: #eceae4; --muted: #a3a29b; --line: #2c2e31;
  --chip: #26282b; --ink-btn: #eceae4; --ink-btn-fg: #121315;
  --ok: #4cc24c; --ok-bg: #16301a; --risk: #f0b45a; --risk-bg: #3a2a10; --fail: #f07a72; --fail-bg: #3d1a19;
  --glass: rgba(27,29,32,.86); --tip-bg: #eceae4; --tip-fg: #121315;
  --vw-bg: #17191b; --vw-grid: #3a3d40; --vw-grid-2: #26292b; --vw-neutral: #57575a; --vw-part: #8e9286; --vw-dark: 1;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121315; --surface: #1b1d20; --fg: #eceae4; --muted: #a3a29b; --line: #2c2e31;
  --chip: #26282b; --ink-btn: #eceae4; --ink-btn-fg: #121315;
  --ok: #4cc24c; --ok-bg: #16301a; --risk: #f0b45a; --risk-bg: #3a2a10; --fail: #f07a72; --fail-bg: #3d1a19;
  --glass: rgba(27,29,32,.86); --tip-bg: #eceae4; --tip-fg: #121315;
  --vw-bg: #17191b; --vw-grid: #3a3d40; --vw-grid-2: #26292b; --vw-neutral: #57575a; --vw-part: #8e9286; --vw-dark: 1;
  color-scheme: dark; }
html, body { background: var(--bg); color: var(--fg); }
body { font: 15px/1.5 var(--font-ui); margin: 0; }
.page { max-width: 1240px; margin: 0 auto; padding: 28px 20px 48px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.hdr { display: grid; gap: 10px; }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.hdr h1 { margin: 0; font-size: clamp(24px, 3.4vw, 34px); line-height: 1.15; font-weight: 700; text-wrap: balance; letter-spacing: -.01em; }
.sub { margin: 0; color: var(--muted); max-width: 70ch; }
.specs { display: flex; flex-wrap: wrap; gap: 6px 8px; }
.spec { display: inline-flex; gap: 6px; align-items: baseline; padding: 4px 9px; border-radius: 6px; background: var(--chip); font-size: 13px; }
.spec span { color: var(--muted); }
.spec b { font-weight: 600; font-family: var(--font-num); font-size: 12.5px; }
.cases { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.case { text-align: left; font: inherit; color: inherit; cursor: pointer; display: grid; gap: 8px; align-content: start;
  padding: 14px 16px 15px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); min-width: 0; }
.case:hover { border-color: var(--muted); }
.case:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.case.on { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); }
.case-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.case h3 { margin: 0; font-size: 15px; font-weight: 600; line-height: 1.3; }
.case .kind { font-size: 12px; color: var(--muted); }
.verdict { flex: none; font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 99px; white-space: nowrap; }
.verdict.ok { color: var(--ok); background: var(--ok-bg); }
.verdict.risk { color: var(--risk); background: var(--risk-bg); }
.verdict.fail { color: var(--fail); background: var(--fail-bg); }
.sfrow { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.sfbig { font-family: var(--font-num); font-size: 30px; font-weight: 600; line-height: 1; letter-spacing: -.02em; }
.sfbig.ok { color: var(--ok); } .sfbig.risk { color: var(--risk); } .sfbig.fail { color: var(--fail); }
.sflabel { font-size: 12px; color: var(--muted); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 13px; margin: 0; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; min-width: 0; }
.warn { font-size: 12.5px; line-height: 1.4; padding: 7px 9px; border-radius: 6px; background: var(--risk-bg); color: var(--fg); }
.stage { display: grid; gap: 10px; }
.tools { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.seg { display: inline-flex; flex-wrap: wrap; background: var(--chip); border-radius: 8px; padding: 3px; gap: 2px; }
.seg button { font: 500 13px/1 var(--font-ui); color: var(--fg); background: transparent; border: 0; border-radius: 6px; padding: 7px 10px; cursor: pointer; }
.seg button.on { background: var(--ink-btn); color: var(--ink-btn-fg); }
.seg button:focus-visible, .tbtn:focus-visible { outline: 2px solid var(--fg); outline-offset: 1px; }
.ctl { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.ctl input[type=range] { width: 120px; accent-color: var(--fg); }
.ctl select { font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }
.tbtn { font: 500 12.5px/1 var(--font-ui); color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; cursor: pointer; }
.viewer { position: relative; height: min(68vh, 640px); min-height: 360px; border-radius: 12px; border: 1px solid var(--line); background: var(--vw-bg); }
.viewer-fallback { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 14px; padding: 20px; text-align: center; }
.details { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 22px; }
.details h2 { font-size: 16px; margin: 0 0 10px; font-weight: 600; }
.details p, .details li { font-size: 14px; color: var(--fg); max-width: 68ch; }
.details ul { padding-left: 18px; margin: 0; display: grid; gap: 6px; }
.tbl-wrap { overflow-x: auto; }
table.props { border-collapse: collapse; font-size: 13px; width: 100%; }
table.props th, table.props td { padding: 5px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
table.props th:first-child, table.props td:first-child { text-align: left; }
table.props th { color: var(--muted); font-weight: 500; }
table.props td { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.foot { font-size: 12px; color: var(--muted); }
@media (max-width: 760px) {
  .page { padding: 18px 16px 36px; }
  .details { grid-template-columns: minmax(0, 1fr); }
  .viewer { height: 62vh; min-height: 320px; }
  .ctl input[type=range] { width: 90px; }
}
/*__VIEWER_CSS__*/
</style>
<div class="page">
__HEADER__
<section class="cases" id="cases" aria-label="Расчётные случаи">
__CASES__
</section>
<section class="stage" aria-label="3D-модель">
  <div class="tools">
    <div class="seg" id="fields" role="group" aria-label="Что показать">
      <button type="button" data-f="sf" class="on">Запас прочности</button>
      <button type="button" data-f="stress">Напряжения</button>
      <button type="button" data-f="disp">Перемещения</button>
      <button type="button" data-f="mode">Что разрушится</button>
      <button type="button" data-f="structure">Структура печати</button>
    </div>
    <label class="ctl"><input type="checkbox" id="deformOn"> Деформация ×<span class="num" id="deformVal">—</span><input type="range" id="deform" min="0" max="100" value="50" aria-label="Масштаб деформации"></label>
    <label class="ctl">Разрез
      <select id="secAxis" aria-label="Ось разреза"><option value="">нет</option><option value="0">по X</option><option value="1">по Y</option><option value="2">по Z</option></select>
      <input type="range" id="secPos" min="0" max="1000" value="500" aria-label="Положение разреза" disabled></label>
    <span class="ctl"><button type="button" class="tbtn" data-v="iso">Изометрия</button><button type="button" class="tbtn" data-v="front">Спереди</button><button type="button" class="tbtn" data-v="top">Сверху</button></span>
  </div>
  <div class="viewer" id="viewer"><div class="viewer-fallback" id="vfb">Загружаю 3D-модель…</div><div class="legend" id="legend" hidden></div>
    <div class="axes-note"><i class="ax-x">X</i> <i class="ax-y">Y</i> <i class="ax-z">Z</i> — оси принтера, мм от угла детали<br>вращение — мышь, сдвиг — правая кнопка или Shift</div></div>
</section>
__DETAILS__
</div>
